
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Transport & Recovery (N.E)</title>
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body>
<header>
<h1>Elite Transport & Recovery (N.E)</h1>
<p>24/7 Recovery & Transport</p>
<a class="btn" href="tel:+447000000000">Emergency Call</a>
<a class="btn whatsapp" href="https://wa.me/447000000000">WhatsApp</a>
</header>

<section>
<h2>Google Maps Area</h2>
<iframe src="https://maps.google.com/maps?q=Bishop%20Auckland&t=&z=10&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<section>
<h2>Live Driver Tracking</h2>
<p>Add your tracking software embed here.</p>
</section>

<section>
<h2>Instant Quote Calculator</h2>
<input type="number" id="miles" placeholder="Enter miles">
<button onclick="calculateQuote()">Calculate</button>
<p id="result"></p>
</section>

<section>
<h2>Upload Breakdown Photos</h2>
<input type="file" multiple>
</section>

<section>
<h2>Emergency Job Request</h2>
<form action="https://formsubmit.co/your@email.com" method="POST">
<input type="text" placeholder="Name" required>
<input type="tel" placeholder="Phone" required>
<textarea placeholder="Issue"></textarea>
<button type="submit">Send Request</button>
</form>
</section>

<footer>
<p>© 2026 Elite Transport & Recovery (N.E)</p>
</footer>
</body>
</html>
